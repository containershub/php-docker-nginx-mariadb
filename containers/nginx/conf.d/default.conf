server {
    listen 80;
    # It will listen to both localhost and phpapp.test
    server_name localhost phpapp.test;
    #root /app/public;
    root /var/www/html/public;
    index index.php index.html;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~\.php$ {
        # Enable path splitting for virtual routes
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        # Connects directly to the php container service over the internal network
		fastcgi_pass php:9000;
		fastcgi_index index.php;

        # FIRST, load the default parameters
		include fastcgi_params;

        # ONLY AFTER THAT, override the Docker-specific variables!
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param REQUEST_METHOD $request_method;
    }
}
