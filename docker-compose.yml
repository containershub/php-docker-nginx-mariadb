version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: ./containers/nginx/Dockerfile
    ports:
      - "${HOST_HTTP_PORT}:80"
    volumes:
      - ./app:/var/www/html
      # Must be done by nginx/Dockerfile
      # - ./containers/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
  
  php:
    build:
      context: .
      dockerfile: ./containers/php/Dockerfile
    volumes:
      - ./app:/var/www/html
      - ./containers/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    environment:
      MYSQL_HOST: mariadb # MySQL Host is the name of mariadb service
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    networks:
      - app-network
      
  mariadb:
    image: mariadb:latest
    volumes:
      - mariadbdata:/var/lib/mysql # Persistent database storage
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - app-network

  adminer:
    image: adminer:latest
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - mariadb

  mailpit:
    image: axllent/mailpit:latest
    logging:
      driver: 'none' # Disable saving logs
    ports:
      - "8025:8025" # Web UI dashboard to read emails
      - "1025:1025" # SMTP Port the PHP app sends mails to
    networks:
      - app-network
  
  node:
    build:
      context: .
      dockerfile: ./containers/node/Dockerfile
    volumes:
      # Why mount './app' instead of just './app/public'?
      # Even though your Node operations happen inside public, we mount the entire
      # ./app to /var/www/html. This ensures that your Node frontend assets
      # (like Vite or Tailwind) can easily scan your PHP source files inside
      # ../src or templates to automatically strip unused CSS classes or trigger
      # hot-reloads when you change your backend views.
      - ./app:/var/www/html
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    networks:
      - app-network

# Global declarations ensuring data persistence and network isolation
volumes:
  mariadbdata: # This matches the volume name used in the mariadb service above

networks:
  app-network:
    driver: bridge
